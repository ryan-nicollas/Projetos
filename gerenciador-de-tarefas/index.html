<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <p class="subtitle">ORGANIZE SEU DIA</p>
            <h1>TaskFlow</h1>
            <p>Suas tarefas, em um só lugar.</p>
        </header>

        <section class="task-form">

            <input
                type="text"
                id="taskInput"
                placeholder="O que você precisa fazer?"
                autocomplete="off"
            >

            <button id="addButton">
                + Adicionar
            </button>

        </section>

        <section class="info">

            <span id="taskCounter">
                0 tarefas
            </span>

            <div class="filters">
                <button class="filter active" data-filter="all">
                    Todas
                </button>

                <button class="filter" data-filter="pending">
                    Pendentes
                </button>

                <button class="filter" data-filter="completed">
                    Concluídas
                </button>
            </div>

        </section>

        <ul id="taskList"></ul>

        <div id="emptyMessage" class="empty">
            <span>✓</span>
            <h2>Tudo tranquilo por aqui</h2>
            <p>Adicione uma tarefa para começar.</p>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
